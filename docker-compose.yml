version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: technicalai_postgres
    environment:
      POSTGRES_USER: technicalai
      POSTGRES_PASSWORD: technicalai
      POSTGRES_DB: technicalai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U technicalai -d technicalai"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: technicalai_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: technicalai_api
    environment:
      DATABASE_URL: postgresql://technicalai:technicalai@postgres:5432/technicalai
      REDIS_URL: redis://redis:6379/0
      PYTHON_BACKEND_URL: http://localhost:8000
      ML_PREDICTION_SERVICE: http://localhost:3032
      ML_TRAINER_SERVICE: http://localhost:3033
      TSE_SERVICE_URL: http://localhost:3031
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./api:/app/api
      - ./prisma:/app/prisma
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: technicalai_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./src:/app/src
      - ./public:/app/public
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: technicalai_network