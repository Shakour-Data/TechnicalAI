name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd api && pip install -r requirements.txt
          npm ci
      - name: Lint Python with ruff
        run: |
          cd api && pip install ruff black isort
          ruff check api/
          ruff format --check api/
          black --check api/
          isort --check api/
      - name: Lint TypeScript with prettier and eslint
        run: |
          npx prettier --check .
          npx eslint . --ext .ts,.tsx

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Prisma validate
        run: npx prisma validate

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd api && pip install -r requirements.txt
      - name: Run Python tests
        run: |
          cd api && pytest tests/ -v --cov=api --cov-report=xml --cov-fail-under=80
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: api/coverage.xml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Security audit
        run: |
          cd api && pip install pip-audit
          pip-audit -r requirements.txt

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, security]
    steps:
      - uses: actions/checkout@v4
      - name: Build API Docker image
        run: docker build -t technicalai-api:latest .
      - name: Build Frontend Docker image
        run: docker build -f Dockerfile.frontend -t technicalai-frontend:latest .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to production
        run: echo "Deploy to production"